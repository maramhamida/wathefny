name: wathefnyproject
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  http: ^1.1.0
  cupertino_icons: ^1.0.8
  animated_splash_screen: ^1.3.0
  image_picker: ^1.0.7
  file_picker: ^10.3.7
  cloudinary_public: ^0.23.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_28pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_28pt-Bold.ttf
          weight: 700

    - family: JosefinSans
      fonts:
        - asset: assets/fonts/JosefinSans-Regular.ttf
          weight: 400

    - family: Adamina
      fonts:
        - asset: assets/fonts/Adamina-Regular.ttf
          weight: 700

    - family: Aleo
      fonts:
        - asset: assets/fonts/Aleo-Regular.ttf
          weight: 700